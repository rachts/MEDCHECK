<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MEDCHECK">
  <!--
    Maskable variant. Android crops a maskable icon to an arbitrary shape (circle,
    squircle, teardrop) and only the centre 80% is guaranteed to survive, so the
    shield is inset well inside that safe zone and the background is drawn edge to
    edge. Using the unpadded favicon.svg as maskable would clip the shield's point.
  -->
  <rect width="32" height="32" fill="#0F172A"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 10 L21.6 12 v4.6 c0 3.4 -2.4 5.5 -5.6 6.9 c-3.2 -1.4 -5.6 -3.5 -5.6 -6.9 V12 Z"/>
    <path d="M13.5 16.7 l1.8 1.8 l3.3 -3.4"/>
  </g>
</svg>
