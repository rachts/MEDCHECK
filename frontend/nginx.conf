server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers live in a separate file and are included per-location.
    # See nginx-security-headers.conf for why: a location that sets any header of
    # its own inherits NONE from its parent, so the server-level set was being
    # discarded for every static asset.
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # The service worker must never be cached. It is not content-hashed, so a
    # cached /sw.js pins the caching policy it contains -- including the
    # "never cache /api/" rule -- until the browser happens to revalidate. The
    # regex block below would otherwise match it and set expires 1y.
    # `location =` (exact match) wins over any regex location regardless of order.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    # index.html must be revalidated on every load. It is the one file that names
    # the hashed asset bundles, so serving a stale copy points the browser at
    # /assets/index-<oldhash>.js -- which no longer exists after a deploy, leaving
    # a blank page.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    # Deploy-time metadata: short-lived so a corrected sitemap or manifest is
    # picked up the same day rather than a year later.
    location ~* ^/(manifest\.webmanifest|robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
    }

    # Cache static assets aggressively. Safe for /assets/* because Vite stamps a
    # content hash into every bundled filename; the unhashed icons under / are
    # covered by the same rule, which is why replacing one requires a filename
    # change rather than an in-place overwrite.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, no-transform" always;
        expires 1y;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
    }
}
