# ==============================================================================
# MEDCHECK security response headers.
#
# This lives in its own file, and is `include`d into *every* location block in
# nginx.conf, because of a subtle and easily-missed nginx rule:
#
#   add_header directives are inherited from the enclosing block ONLY IF the
#   child block declares no add_header of its own. The moment a location sets
#   a single header, it silently drops every inherited one.
#
# The static-asset location needs its own `add_header Cache-Control`, which
# previously meant every .js, .css and .svg response was served with NONE of the
# security headers below -- including the Content-Security-Policy. Repeating the
# full set per location is the only fix available in stock nginx (the
# headers-more module is not in nginx:alpine).
#
# RULE: any new location block in nginx.conf must include this file.
# ==============================================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ignored by browsers on the plain-HTTP listener below, and correct as soon as a
# TLS terminator (load balancer, Cloudflare, ingress) fronts this container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Mirrors PERMISSIONS_POLICY in backend/main.py. Nothing in this app touches a
# camera, microphone, or location sensor, so every one of them is denied.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy.
#
#   script-src 'self'      -- no 'unsafe-inline'. index.html carries a single
#                             <script type="module" src="/src/main.jsx">; Vite
#                             emits an external hashed bundle, so there is no
#                             inline script to whitelist. Keeping
#                             'unsafe-inline' here would have left the app that
#                             actually renders user input unprotected while the
#                             API-only CSP in backend/main.py was hardened.
#   style-src 'unsafe-inline' -- required, and not removable without a redesign:
#                             severity accents, score bar widths and the
#                             interaction graph are painted with inline style
#                             attributes computed per render.
#   connect-src            -- localhost entries are for `docker compose up`,
#                             where the browser reaches the API on
#                             http://localhost:8000. A deployment serving the
#                             API from another origin MUST add that origin here
#                             or every fetch will be blocked.
#   worker-src 'self'      -- /sw.js. Falls back to script-src in browsers that
#                             predate worker-src, but stated explicitly so the
#                             service worker does not depend on that fallback.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* https://api.fda.gov; img-src 'self' data: https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
