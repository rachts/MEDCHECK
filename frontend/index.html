<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MEDCHECK — AI Medicine Safety &amp; Interaction Intelligence</title>
    <meta name="description" content="Free clinical-grade drug interaction checker. Analyze drug-drug interactions, amplified side effects, food and alcohol timing, and the Stomach Guardian mucosal stress score for your medicine list." />

    <!-- Icons & installability -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MEDCHECK" />

    <!--
      canonical, og:url and twitter URLs point at https://medcheck.app. That host is
      a placeholder and MUST be replaced with the real origin before launch: a
      canonical tag naming a domain you do not control tells search engines to
      credit that domain instead of yours, and Open Graph previews will 404.
      The same placeholder appears in public/sitemap.xml and public/robots.txt.
    -->
    <link rel="canonical" href="https://medcheck.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDCHECK" />
    <meta property="og:title" content="MEDCHECK — Medicine Safety &amp; Interaction Intelligence" />
    <meta property="og:description" content="Check drug-drug interactions, compounded side effects, food and alcohol timing, and stomach risk for your full medicine list." />
    <meta property="og:url" content="https://medcheck.app/" />
    <meta property="og:image" content="https://medcheck.app/favicon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X. summary rather than summary_large_image: the only artwork
         shipped is the icon, and a large-image card with a tiny logo renders badly.
         Switch to summary_large_image once a real 1200x630 og:image exists. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MEDCHECK — Medicine Safety &amp; Interaction Intelligence" />
    <meta name="twitter:description" content="Check drug-drug interactions, compounded side effects, food and alcohol timing, and stomach risk for your full medicine list." />
    <meta name="twitter:image" content="https://medcheck.app/favicon.svg" />

    <!-- Google Fonts: Cormorant Garamond (Editorial Authority), Inter (Clean Body), JetBrains Mono (Metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
