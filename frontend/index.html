<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MEDCHECK — Clinical Medicine Safety &amp; Drug Interaction Intelligence</title>
    <meta name="description" content="Evidence-cited drug interaction checker. Analyze drug-drug interactions, amplified side effects, food and alcohol timing, and the Stomach Guardian heuristic mucosal stress indicator for your medicine list." />

    <!-- Icons & installability -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8f6f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MEDCHECK" />

    <!--
      %VITE_SITE_URL% is substituted at build time by Vite from the VITE_SITE_URL
      environment variable (see vite.config.js, which also templates
      public/robots.txt and public/sitemap.xml from the same value and warns on a
      production build that leaves it unset).
    -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MEDCHECK" />
    <meta property="og:title" content="MEDCHECK — Medicine Safety &amp; Interaction Intelligence" />
    <meta property="og:description" content="Check drug-drug interactions, compounded side effects, food and alcohol timing, and stomach risk for your full medicine list." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/favicon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MEDCHECK — Medicine Safety &amp; Interaction Intelligence" />
    <meta name="twitter:description" content="Check drug-drug interactions, compounded side effects, food and alcohol timing, and stomach risk for your full medicine list." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/favicon.svg" />

    <!-- Google Fonts: Newsreader, IBM Plex Serif, IBM Plex Mono (Editorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
