version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medcheck-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - SQLITE_DB_PATH=/app/data/local_cache.db
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
    env_file:
      - .env
    volumes:
      - medcheck-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A compose healthcheck block replaces the image's HEALTHCHECK wholesale, so
      # the start_period set in backend/Dockerfile does not carry over and has to
      # be repeated here. Without it the grace period is 0s: the first probe fires
      # while the app is still importing (schema migration, expired-row sweep,
      # knowledge-base load) and the container is restarted before it ever
      # finished starting.
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medcheck-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  medcheck-data:
    driver: local
